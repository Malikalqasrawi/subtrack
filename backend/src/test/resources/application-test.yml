spring:
  datasource:
    # The address and the owner's login come from the PostgreSQL that PostgresTest starts.
    username: subtrack_app
    password: test-app-password
app:
  security:
    encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  verification:
    global-codes-per-hour: 100000
    global-unverified-codes-per-hour: 100000
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789
  mail:
    mode: recording
    async: false
    jobs: false
  reminders:
    enabled: false
  exchange-rates:
    provider: fixed
  rate-limit:
    rules:
      - name: api
        path-prefix: /api/
        capacity: 10000
        window: 1m
