# Local development without Docker for the backend: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
app:
  security:
    encryption-key: ${ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
  mail:
    mode: ${MAIL_MODE:log}
