services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: subtrack
      POSTGRES_USER: subtrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Reachable from this machine only, for running the backend outside Docker.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subtrack -d subtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the app sends and shows it at http://localhost:8025.
  # For real delivery, point the MAIL_* variables at an SMTP provider instead.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  backend:
    build: ./backend
    ports:
      # Lets `npm run dev` in frontend/ reach this backend. This machine only.
      # Host port 8081 because 8080 is commonly taken by other local projects.
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/subtrack
      DB_USERNAME: subtrack
      DB_PASSWORD: ${DB_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Copy .env.example to .env and set DB_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Copy .env.example to .env and set ENCRYPTION_KEY}
      PRODUCTION: ${PRODUCTION:-false}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Subtrack <no-reply@subtrack.local>}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      # This machine only, unless APP_BIND opens it to the network (see .env.example).
      - "${APP_BIND:-127.0.0.1}:3000:80"
    depends_on:
      - backend

volumes:
  db-data:
