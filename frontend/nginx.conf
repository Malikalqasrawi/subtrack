server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # The browser only ever talks to this origin, so no CORS setup is needed.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Overwritten rather than appended, so a client cannot fake its IP to dodge rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # A location with its own add_header drops the server-level ones, so they are repeated.
        include /etc/nginx/security-headers.conf;
    }

    # Client-side routes all resolve to the single page.
    location / {
        try_files $uri /index.html;
    }
}
