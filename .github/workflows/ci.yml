name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7   # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run all tests
        run: ./mvnw -B -ntp verify

      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f   # v6
        with:
          name: test-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile lint, type check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - name: Create a throwaway .env (random values, used only in this run)
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } > .env

      - name: Build the images and start the stack
        run: docker compose up -d --build

      - name: Wait until the app answers through nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/public/config; then
              echo
              echo "App is up"
              exit 0
            fi
            sleep 5
          done
          echo "The app didn't start. Backend log:"
          docker compose logs backend
          exit 1

      - name: Stop and delete everything
        if: always()
        run: docker compose down -v
